<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CV — Dominic Zappia</title>
  <meta name="description" content="CV of Dominic Zappia — Tech Ethics & Policy researcher at Stanford University.">
  <link rel="canonical" href="https://dzappia.com/cv.html">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;1,400&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
  <link rel="icon" type="image/png" href="/favicon.png">
  <style>
    :root {
      --black: #0f1219;
      --gray-dark: #222933;
      --gray: #5c6780;
      --gray-light: #e5e9f0;
      --accent: #b5451b;
      --bg: #faf9f7;
      --max-width: 680px;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html { font-size: 18px; -webkit-font-smoothing: antialiased; }

    body {
      font-family: 'DM Sans', sans-serif;
      background: var(--bg);
      color: var(--gray-dark);
      line-height: 1.7;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    header {
      border-bottom: 1px solid var(--gray-light);
      background: var(--bg);
      position: sticky;
      top: 0;
      z-index: 10;
    }

    nav {
      max-width: var(--max-width);
      margin: 0 auto;
      padding: 0 1.5rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      height: 56px;
    }

    .nav-name {
      font-family: 'EB Garamond', serif;
      font-size: 1.15rem;
      font-weight: 500;
      color: var(--black);
      text-decoration: none;
    }

    .nav-links {
      display: flex;
      gap: 1.75rem;
      list-style: none;
    }

    .nav-links a {
      font-size: 0.85rem;
      color: var(--gray);
      text-decoration: none;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      transition: color 0.15s;
    }

    .nav-links a:hover, .nav-links a.active { color: var(--black); }
    .nav-links a.active { font-weight: 500; }

    main {
      flex: 1;
      max-width: var(--max-width);
      width: 100%;
      margin: 0 auto;
      padding: 5rem 1.5rem;
      display: flex;
      flex-direction: column;
      gap: 1.5rem;
      opacity: 0;
      transform: translateY(16px);
      animation: fadeUp 0.5s ease forwards;
    }

    h1 {
      font-family: 'EB Garamond', serif;
      font-size: 2.4rem;
      font-weight: 400;
      color: var(--black);
      line-height: 1.15;
    }

    p {
      font-size: 1rem;
      color: var(--gray);
    }

    .download-btn {
      display: inline-block;
      margin-top: 0.5rem;
      padding: 0.65rem 1.4rem;
      background: var(--black);
      color: #fff;
      font-size: 0.85rem;
      font-weight: 500;
      letter-spacing: 0.04em;
      text-decoration: none;
      border-radius: 3px;
      transition: background 0.15s;
    }

    .download-btn:hover { background: var(--accent); }

    footer {
      border-top: 1px solid var(--gray-light);
      text-align: center;
      padding: 1.5rem;
      font-size: 0.8rem;
      color: var(--gray);
    }

    @keyframes fadeUp {
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>

  <header>
    <nav>
      <a href="/" class="nav-name">Dominic Zappia</a>
      <ul class="nav-links">
        <li><a href="/">Home</a></li>
        <li><a href="/cv.html" class="active">CV</a></li>
      </ul>
    </nav>
  </header>

  <main>
    <h1>Curriculum Vitae</h1>
    <p>You can find my CV <a href="/ZappiaResumePublic.pdf">here</a>.</p>
  </main>

  <footer>
    &copy; 2025 Dominic Zappia
  </footer>

</body>
</html>
