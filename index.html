<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Dominic Zappia</title>
  <meta name="description" content="Dominic Zappia — Tech Ethics & Policy researcher at Stanford University.">
  <link rel="canonical" href="https://dzappia.com/">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;1,400&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
  <style>
    :root {
      --black: #0f1219;
      --gray-dark: #222933;
      --gray: #5c6780;
      --gray-light: #e5e9f0;
      --accent: #b5451b;
      --bg: #faf9f7;
      --max-width: 680px;
    }

    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      font-size: 18px;
      -webkit-font-smoothing: antialiased;
    }

    body {
      font-family: 'DM Sans', sans-serif;
      background: var(--bg);
      color: var(--gray-dark);
      line-height: 1.7;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* NAV */
    header {
      border-bottom: 1px solid var(--gray-light);
      background: var(--bg);
      position: sticky;
      top: 0;
      z-index: 10;
    }

    nav {
      max-width: var(--max-width);
      margin: 0 auto;
      padding: 0 1.5rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      height: 56px;
    }

    .nav-name {
      font-family: 'EB Garamond', serif;
      font-size: 1.15rem;
      font-weight: 500;
      color: var(--black);
      text-decoration: none;
      letter-spacing: 0.01em;
    }

    .nav-links {
      display: flex;
      gap: 1.75rem;
      list-style: none;
    }

    .nav-links a {
      font-size: 0.85rem;
      font-weight: 400;
      color: var(--gray);
      text-decoration: none;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      transition: color 0.15s;
    }

    .nav-links a:hover,
    .nav-links a.active {
      color: var(--black);
    }

    .nav-links a.active {
      font-weight: 500;
    }

    /* MAIN */
    main {
      flex: 1;
      max-width: var(--max-width);
      width: 100%;
      margin: 0 auto;
      padding: 4rem 1.5rem 5rem;
    }

    /* INTRO */
    .intro {
      margin-bottom: 3.5rem;
      opacity: 0;
      transform: translateY(16px);
      animation: fadeUp 0.5s ease forwards;
    }

    .intro h1 {
      font-family: 'EB Garamond', serif;
      font-size: 2.8rem;
      font-weight: 400;
      color: var(--black);
      line-height: 1.15;
      margin-bottom: 1.5rem;
    }

    .intro p {
      color: var(--gray-dark);
      font-size: 1rem;
      margin-bottom: 1rem;
      max-width: 580px;
    }

    .intro p:last-of-type {
      margin-bottom: 0;
    }

    .intro a {
      color: var(--accent);
      text-decoration: none;
      border-bottom: 1px solid transparent;
      transition: border-color 0.15s;
    }

    .intro a:hover {
      border-bottom-color: var(--accent);
    }

    /* PHOTO */
    .photo-block {
      margin-top: 3rem;
      opacity: 0;
      transform: translateY(16px);
      animation: fadeUp 0.5s ease 0.15s forwards;
    }

    .photo-block img {
      width: 100%;
      border-radius: 4px;
      display: block;
    }

    .photo-block figcaption {
      margin-top: 0.75rem;
      font-size: 0.85rem;
      color: var(--gray);
      font-style: italic;
      text-align: center;
    }

    /* CONTACT */
    .contact {
      margin-top: 3rem;
      padding-top: 2rem;
      border-top: 1px solid var(--gray-light);
      font-size: 0.9rem;
      color: var(--gray);
      opacity: 0;
      animation: fadeUp 0.5s ease 0.25s forwards;
    }

    .contact a {
      color: var(--gray-dark);
      text-decoration: none;
      border-bottom: 1px solid var(--gray-light);
      transition: border-color 0.15s, color 0.15s;
    }

    .contact a:hover {
      color: var(--accent);
      border-bottom-color: var(--accent);
    }

    /* FOOTER */
    footer {
      border-top: 1px solid var(--gray-light);
      text-align: center;
      padding: 1.5rem;
      font-size: 0.8rem;
      color: var(--gray);
    }

    @keyframes fadeUp {
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @media (max-width: 600px) {
      .intro h1 {
        font-size: 2rem;
      }

      main {
        padding: 2.5rem 1.25rem 4rem;
      }
    }
  </style>
</head>
<body>

  <header>
    <nav>
      <a href="/" class="nav-name">Dominic Zappia</a>
      <ul class="nav-links">
        <li><a href="/" class="active">Home</a></li>
        <li><a href="/cv.html">CV</a></li>
      </ul>
    </nav>
  </header>

  <main>
    <div class="intro">
      <h1>Hi, I'm Dom.</h1>
      <p>My website is currently under construction — come back soon!</p>
      <p>
        In the meantime, you can find out what I'm up to at Stanford
        <a href="https://ethicsinsociety.stanford.edu/people/dominic-zappia">here</a>,
        follow me on LinkedIn
        <a href="https://linkedin.com/in/domzappia/">here</a>,
        and find my CV <a href="/cv.html">here</a>.
      </p>
    </div>

    <figure class="photo-block">
      <img
        src="https://cdn.builder.io/api/v1/image/assets%2Fc4790eb4f63740e0af4eccf5f786ee94%2F697bdce599564971839d3e01de4be032?format=webp&width=800"
        alt="Dom at Stanford"
      >
      <figcaption>From my current adventure at Stanford as a Tech Ethics &amp; Policy Rising Scholar with Professor Rob Reich.</figcaption>
    </figure>

    <div class="contact">
      Contact: <a href="mailto:zappiadominic@gmail.com">zappiadominic@gmail.com</a>
    </div>
  </main>

  <footer>
    &copy; 2025 Dominic Zappia
  </footer>

</body>
</html>
